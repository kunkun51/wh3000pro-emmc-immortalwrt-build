name: Build 237mtk WH3000Pro EMMC 

# 独立工作流：复用仓库 diy-part1.sh / diy-part2.sh（含 files / plugin）
# 配置来源为仓库 devconfig/237.config（目标行由 env 覆盖）

on:
  workflow_dispatch:
#  push:
#    branches: [ main ]

env:
  # openwrt-24.10-6.6 分支 = 官方 ImmortalWrt 24.10 源码 + 内置 MTK 闭源 WiFi 驱动
  # （闭源驱动位于 package/mtk/drivers/mt_wifi + conninfra + warp）
  REPO_URL: https://github.com/kunkun51/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  TARGET_BOARD: mediatek
  TARGET_SUBTARGET: filogic
  # 该分支原生支持 huasifei_wh3000-pro（WH3000 Pro eMMC，DTS: mt7981b-huasifei-wh3000-pro）
  # 无需任何 DTS 补丁
  PROFILE: huasifei_wh3000-pro
  DIY1: diy-part1.sh
  DIY2: diy-part2.sh

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free up disk space
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
          git gzip libncurses-dev libssl-dev libxml2 libxslt-dev make nano pkgconf python3 python3-pip \
          python3-setuptools rsync sed swig tar unzip wget zlib1g-dev

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth 1 -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} openwrt
          cd openwrt
          # 兼容 6.6.133：u64_stats API 的 _irq 变体已被上游删除，fibocom qmi_wwan_f 仍在使用
          sed -i 's/u64_stats_fetch_begin_irq/u64_stats_fetch_begin/g; s/u64_stats_fetch_retry_irq/u64_stats_fetch_retry/g' \
            package/mtk/applications/5g-modem/fibocom_QMI_WWAN/src/qmi_wwan_f.c
          sed -i 's/192.168.6.1/192.168.1.1/g' package/base-files/files/bin/config_generate
          grep -q '192\.168\.1\.1' package/base-files/files/bin/config_generate || { echo "::error::LAN IP patch failed"; exit 1; }

      - name: Apply MT7981 WiFi driver 7.6.7.3 upgrade package
        shell: bash
        run: |
          set -e
          cd openwrt

          echo "=== mt_wifi 7.6.7.3 source + firmware ==="
          rm -rf package/mtk/drivers/mt_wifi/src
          mkdir -p package/mtk/drivers/mt_wifi/src
          tar -xJf ../driver-upgrade/mt79xx_20250408-705eb4.tar.xz -C package/mtk/drivers/mt_wifi/src
          cp package/mtk/drivers/mt_wifi/src/bin/mt7981/rebb/*.bin \
             package/mtk/drivers/mt_wifi/files/mt7981-fw-20240613/

          echo "=== warp 20250408 ==="
          rm -rf package/mtk/drivers/warp/src
          mkdir -p package/mtk/drivers/warp/src
          tar -xJf ../driver-upgrade/warp_20250408-5f71ec.tar.xz -C package/mtk/drivers/warp/src --strip-components=1
          # 6.6 内核已移除 MODULE_SUPPORTED_DEVICE，升级包仍在用
          sed -i '/MODULE_SUPPORTED_DEVICE/d' package/mtk/drivers/warp/src/warp_main.c

          echo "=== conninfra 20231229 ==="
          rm -rf package/mtk/drivers/conninfra/src
          mkdir -p package/mtk/drivers/conninfra/src
          tar -xJf ../driver-upgrade/mt79xx_conninfra_20231229-f2fa25.tar.xz -C package/mtk/drivers/conninfra/src --strip-components=1

          # 6.4+ 内核的 class_create() 已移除 owner 参数，升级包仍是旧写法，统一改为单参数
          grep -rl 'class_create(THIS_MODULE' package/mtk/drivers/conninfra/src | while read -r f; do
            sed -i 's/class_create(THIS_MODULE,[[:space:]]*/class_create(/' "$f"
          done
          grep -rn 'class_create' package/mtk/drivers/conninfra/src || true

          # 6.6 内核已移除 ioremap_nocache()（5.11 起改名），升级包仍在用
          grep -rl 'ioremap_nocache' package/mtk/drivers/conninfra/src | while read -r f; do
            sed -i 's/ioremap_nocache(/ioremap(/g' "$f"
          done
          grep -rn 'ioremap_nocache' package/mtk/drivers/conninfra/src || echo "ioremap_nocache: none left"

          # 6.6 内核不再提供 struct timeval，升级包的 osal.h 缺少定义，补回 fork 原版的写法
          python3 - <<'PY'
          p = 'package/mtk/drivers/conninfra/src/base/include/osal.h'
          s = open(p).read()
          if 'struct timeval {' not in s:
              block = ('typedef long __kernel_time_t;\n\n'
                       'struct timeval {\n'
                       '\t__kernel_time_t\t\ttv_sec;\t\t/* seconds */\n'
                       '\t__kernel_suseconds_t\ttv_usec;\t/* microseconds */\n'
                       '};\n\n')
              needle = 'int osal_gettimeofday2(struct timeval *tv);'
              s = s.replace(needle, block + needle, 1)
              open(p, 'w').write(s)
              print('patched struct timeval into conninfra osal.h')
          PY

          echo "=== datconf 757f9679 ==="
          mkdir -p dl
          cp ../driver-upgrade/datconf-757f9679.tar.bz2 dl/
          sed -i 's/^PKG_REVISION:=.*/PKG_REVISION:=757f9679/' package/mtk/applications/datconf/Makefile

          echo "=== version strings & obsolete patch hook ==="
          sed -i 's|^PKG_VERSION:=.*|PKG_VERSION:=7.6.7.3-$(PKG_SUFFIX)|' package/mtk/drivers/mt_wifi/Makefile
          sed -i 's|^PKG_VERSION:=.*|PKG_VERSION:=20250408-5f71ec|' package/mtk/drivers/warp/Makefile
          sed -i 's|^PKG_VERSION:=.*|PKG_VERSION:=f2fa25|' package/mtk/drivers/conninfra/Makefile
          sed -i 's|^Hooks/Prepare/Post := FIXUP_NEW_MCU_FW_API|#Hooks/Prepare/Post := FIXUP_NEW_MCU_FW_API|' package/mtk/drivers/mt_wifi/Makefile
          grep -H '^PKG_VERSION' package/mtk/drivers/mt_wifi/Makefile package/mtk/drivers/warp/Makefile package/mtk/drivers/conninfra/Makefile

      - name: diy-part1 feeds
        run: |
          cd openwrt
          chmod +x ../${{ env.DIY1 }}
          ../${{ env.DIY1 }}
          cat feeds.conf.default

      - name: Feeds update & install
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: diy-part2 copy plugin & modify config
        run: |
          cd openwrt
          chmod +x ../${{ env.DIY2 }}
          ../${{ env.DIY2 }}
          ls -l files/etc/uci-defaults/
          ls -l package/plugin/

      - name: Import config from devconfig/237.config
        shell: bash
        run: |
          cd openwrt
          cp ../devconfig/237.config .config

          # devconfig 中的历史目标行（mediatek_mt7981 / huasifei_wh3000-pro-emmc）在本分支不存在，
          # 统一按工作流 env 覆盖目标，其余包/驱动选项全部沿用 devconfig
          sed -i '/^CONFIG_TARGET_mediatek/d; /^CONFIG_TARGET_DEVICE_/d' .config
          cat >> .config <<EOF
          CONFIG_TARGET_${{ env.TARGET_BOARD }}=y
          CONFIG_TARGET_${{ env.TARGET_BOARD }}_${{ env.TARGET_SUBTARGET }}=y
          CONFIG_TARGET_DEVICE_${{ env.TARGET_BOARD }}_${{ env.TARGET_SUBTARGET }}_DEVICE_${{ env.PROFILE }}=y
          EOF

          # 元数据探针：检查 targetinfo 缓存文件
          if grep -q "${{ env.PROFILE }}" tmp/.targetinfo 2>/dev/null; then
            echo "::notice::targetinfo: device IS registered"
          else
            echo "::error::targetinfo: device NOT registered"
          fi

          make defconfig 2>&1 | tee /tmp/defconfig.log

          # 探针 A：defconfig 警告（kconfig 未知符号警告会出现在这里）
          if grep -qiE "warning|error|not found|unknown" /tmp/defconfig.log; then
            grep -iE "warning|error|not found|unknown" /tmp/defconfig.log | head -10 | while IFS= read -r l; do echo "::warning::defconfig: $l"; done
          else
            echo "::notice::defconfig produced no warnings"
          fi

          # 探针 A2：递归依赖的完整符号链（kconfig 会打印 select/depends 链路）
          if grep -q "recursive dependency" /tmp/defconfig.log; then
            grep -A12 "recursive dependency" /tmp/defconfig.log | head -60 | while IFS= read -r l; do echo "::warning::recursion: $l"; done
            python3 -c "import re; log=open('/tmp/defconfig.log',errors='replace').read(); nums=sorted({int(m.group(1)) for m in re.finditer(r'config-package\.in:(\d+)', log)}); cfg=open('tmp/.config-package.in',errors='replace').read().splitlines(); [print('::warning::pkgcfg[' + str(i+1) + '] ' + cfg[i]) for n in nums for i in range(max(1,n-6)-1, min(len(cfg), n+6))]"
          fi

          # 探针 A3：ndisc6/rdisc6 在包元数据中的全部引用（含行号）
          grep -n -iE "ndisc6|rdisc6" tmp/.config-package.in | head -20 | while IFS= read -r l; do echo "::warning::ndisc-ref: $l"; done

          # 探针 B（决定性）：kconfig 片段中设备符号是否存在
          if grep -q "DEVICE_${{ env.PROFILE }}" tmp/.config-target.in 2>/dev/null; then
            echo "::notice::kconfig: device symbol EXISTS in tmp/.config-target.in"
          else
            echo "::error::kconfig: device symbol MISSING from tmp/.config-target.in (gen_target_config skipped it)"
          fi

          # 探针 C：对照组（分支自带的连字符设备名）
          if grep -q "DEVICE_glinet_gl-mt3000" tmp/.config-target.in 2>/dev/null; then
            echo "::notice::kconfig control: glinet_gl-mt3000 symbol EXISTS"
          else
            echo "::warning::kconfig control: glinet_gl-mt3000 symbol MISSING"
          fi

          # 探针 D：目标设备的 targetinfo 块内容（检查 image_build/default 等标志）
          grep -B2 -A20 "huasifei" tmp/.targetinfo | head -40 || true

          echo "=== huasifei lines in final .config ==="
          grep huasifei .config || echo "(none)"

          if ! grep -Fxq "CONFIG_TARGET_DEVICE_${{ env.TARGET_BOARD }}_${{ env.TARGET_SUBTARGET }}_DEVICE_${{ env.PROFILE }}=y" .config; then
            echo "::error::Target device ${{ env.PROFILE }} NOT found in final config!"
            exit 1
          fi
          echo "=== Config validated ==="
          grep -E "^CONFIG_TARGET" .config

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: WH3000Pro-EMMC-Minimal
          path: openwrt/bin/targets/${{ env.TARGET_BOARD }}/${{ env.TARGET_SUBTARGET }}

      - name: Generate release tag
        id: tag
        env:
          TZ: Asia/Shanghai
        run: |
          echo "release_tag=$(TZ=Asia/Shanghai date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          echo "release_date=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 237-${{ steps.tag.outputs.release_tag }}
          name: 237-WH3000Pro-EMMC  ${{ steps.tag.outputs.release_date }}
          body: |
            ## 237 WH3000Pro-EMMC 
            - **源码分支**: ${{ env.REPO_BRANCH }}
            - **目标设备**: ${{ env.PROFILE }}
            - **编译时间**: ${{ steps.tag.outputs.release_date }}
            - **说明**: 配置来自 devconfig/237.config，含自定义 files/plugin；内置 MTK 闭源 WiFi 驱动（mt_wifi）；已包含 QModem feed
          files: |
            openwrt/bin/targets/${{ env.TARGET_BOARD }}/${{ env.TARGET_SUBTARGET }}/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
