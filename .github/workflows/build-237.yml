name: Build 237mtk WH3000Pro EMMC (Minimal)

# 独立工作流：不使用仓库内的 diy-part1.sh / diy-part2.sh / .config / files / plugin
# 一切步骤内联，最小化 config 编译

on:
  workflow_dispatch:
#  push:
#    branches: [ main ]

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: mt798x-mt799x-6.6-mtwifi
  TARGET_BOARD: mediatek
  TARGET_SUBTARGET: filogic
  # 目标设备：WH3000 Pro eMMC 版
  # 该设备在源码分支中不存在，由 "Patch DTS" 步骤从官方 ImmortalWrt 移植 DTS + 设备定义
  PROFILE: huasifei_wh3000-pro-emmc

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
          git gzip libncurses-dev libssl-dev libxml2 libxslt-dev make nano pkgconf python3 python3-pip \
          python3-setuptools rsync sed swig tar unzip wget zlib1g-dev

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth 1 -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} openwrt

      - name: Patch DTS for WH3000 Pro eMMC
        run: |
          cd openwrt

          # 1. 从官方 ImmortalWrt master 下载 WH3000 Pro 的 DTS（公共 dtsi + eMMC 变体）
          curl -fsSL -o target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro.dtsi \
            https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro.dtsi
          curl -fsSL -o target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro-emmc.dts \
            https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro-emmc.dts

          # 2. 本分支没有 mt7981b.dtsi（MT7981B 与 MT7981 同一 die），改用 mt7981.dtsi
          sed -i 's/#include "mt7981b.dtsi"/#include "mt7981.dtsi"/' \
            target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro.dtsi

          # 3. 写入独立的 filogic-extra.mk（image Makefile 原生支持 -include $(SUBTARGET)-extra.mk，
          #    不动主 filogic.mk，避免追加内容破坏其解析）
          cat > target/linux/mediatek/image/filogic-extra.mk <<'EXTRA_EOF'
          define Device/huasifei_wh3000-pro-emmc
            DEVICE_VENDOR := Huasifei
            DEVICE_MODEL := WH3000 Pro
            DEVICE_VARIANT := eMMC
            DEVICE_DTS := mt7981b-huasifei-wh3000-pro-emmc
            DEVICE_DTS_DIR := ../dts
            DEVICE_PACKAGES := kmod-mt7915e kmod-mt7981-firmware mt7981-wo-firmware kmod-hwmon-pwmfan kmod-usb3 f2fsck mkf2fs automount
            SUPPORTED_DEVICES += huasifei,wh3000-pro
            KERNEL := kernel-bin | lzma | fit lzma $$(KDIR)/image-$$(firstword $$(DEVICE_DTS)).dtb
            KERNEL_INITRAMFS := kernel-bin | lzma | fit lzma $$(KDIR)/image-$$(firstword $$(DEVICE_DTS)).dtb with-initrd | pad-to 64k
            IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata
          endef
          TARGET_DEVICES += huasifei_wh3000-pro-emmc
          EXTRA_EOF

          # 4. 校验：include 已替换、extra.mk 内容正确
          grep -n "mt7981.dtsi" target/linux/mediatek/dts/mt7981b-huasifei-wh3000-pro.dtsi
          echo "=== filogic-extra.mk content ==="
          cat target/linux/mediatek/image/filogic-extra.mk
          echo "=== DTS patch done ==="

      - name: Add QModem feed
        run: |
          cd openwrt
          sed -i '$a src-git qmodem https://github.com/kunkun51/QModem;main' feeds.conf.default
          cat feeds.conf.default

      - name: Feeds update & install
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate minimal config
        shell: bash
        run: |
          cd openwrt
          cat > .config <<EOF
          CONFIG_TARGET_${{ env.TARGET_BOARD }}=y
          CONFIG_TARGET_${{ env.TARGET_BOARD }}_${{ env.TARGET_SUBTARGET }}=y
          CONFIG_TARGET_${{ env.TARGET_BOARD }}_${{ env.TARGET_SUBTARGET }}_DEVICE_${{ env.PROFILE }}=y
          EOF

          # 元数据探针 1：直接询问 make，设备是否被注册（结果以注解形式可见）
          DUMP_OUT=$(make -s -C target/linux/mediatek/image DUMP=1 SUBTARGET=filogic 2>&1) \
            || echo "::warning::DUMP probe command itself failed"
          if echo "$DUMP_OUT" | grep -q "Device: ${{ env.PROFILE }}"; then
            echo "::notice::DUMP probe: device IS registered in image metadata"
          else
            echo "::error::DUMP probe: device NOT in image metadata - extra.mk not loaded or block invalid"
          fi

          # 元数据探针 2：检查 targetinfo 缓存文件
          if grep -q "${{ env.PROFILE }}" tmp/.targetinfo 2>/dev/null; then
            echo "::notice::targetinfo: device IS registered"
          else
            echo "::error::targetinfo: device NOT registered"
          fi

          make defconfig 2>&1 | tee /tmp/defconfig.log

          echo "=== defconfig warnings/errors ==="
          grep -iE "warning|error|not found|unknown" /tmp/defconfig.log | head -20 || true

          echo "=== huasifei entries in target metadata (tmp/.targetinfo) ==="
          grep -B1 -A15 "huasifei" tmp/.targetinfo || echo "(no huasifei in targetinfo!)"

          echo "=== huasifei lines in final .config ==="
          grep huasifei .config || echo "(none)"

          if ! grep -Fxq "CONFIG_TARGET_DEVICE_${{ env.TARGET_BOARD }}_${{ env.TARGET_SUBTARGET }}_DEVICE_${{ env.PROFILE }}=y" .config; then
            echo "::error::Target device ${{ env.PROFILE }} NOT found in final config!"
            exit 1
          fi
          echo "=== Config validated ==="
          grep -E "^CONFIG_TARGET" .config

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: WH3000Pro-EMMC-Minimal
          path: openwrt/bin/targets/${{ env.TARGET_BOARD }}/${{ env.TARGET_SUBTARGET }}

      - name: Generate release tag
        id: tag
        env:
          TZ: Asia/Shanghai
        run: |
          echo "release_tag=$(TZ=Asia/Shanghai date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          echo "release_date=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: minimal-${{ steps.tag.outputs.release_tag }}
          name: ImmortalWrt WH3000Pro EMMC Minimal ${{ steps.tag.outputs.release_date }}
          body: |
            ## ImmortalWrt WH3000Pro EMMC (Minimal)
            - **源码分支**: ${{ env.REPO_BRANCH }}
            - **目标设备**: ${{ env.PROFILE }}
            - **编译时间**: ${{ steps.tag.outputs.release_date }}
            - **说明**: 最小化 config 编译，不含自定义 files/plugin；已添加 QModem feed，并从官方 ImmortalWrt 移植 WH3000 Pro eMMC DTS
          files: |
            openwrt/bin/targets/${{ env.TARGET_BOARD }}/${{ env.TARGET_SUBTARGET }}/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
