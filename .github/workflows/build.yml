name: Build ImmortalWrt WH3000Pro EMMC
on:
  workflow_dispatch:
#  push:
#   branches: [ main ]

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TARGET_BOARD: mediatek
  TARGET_SUBTARGET: filogic
  PROFILE: huasifei_wh3000-pro-emmc
  CONFIG_FILE: .config
  DIY1: diy-part1.sh
  DIY2: diy-part2.sh

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
          git gzip libncurses-dev libssl-dev libxml2 libxslt-dev make nano pkgconf python3 python3-pip \
          python3-setuptools rsync sed swig tar unzip wget zlib1g-dev

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth 1 -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} openwrt
          cd openwrt

      - name: diy-part1 feeds
        run: |
          cd openwrt
          chmod +x ../${{ env.DIY1 }}
          ../${{ env.DIY1 }}

      - name: Feeds update & install
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: diy-part2 copy plugin & modify ip
        run: |
          cd openwrt
          chmod +x ../${{ env.DIY2 }}
          ../${{ env.DIY2 }}

      - name: Apply diffconfig
        run: |
          cd openwrt
          cat ../.config > .config

          # 临时规避已知的循环依赖
          sed -i 's/CONFIG_PACKAGE_luci-app-weechat=y/# CONFIG_PACKAGE_luci-app-weechat is not set/' .config || true

          echo "=== Running make defconfig ==="
          if ! make defconfig; then
            echo "::error::defconfig failed due to dependency issues"
            grep -i "recursive dependency\|does not exist" tmp/.config-package.in || true
            exit 1
          fi

          echo "=== Diff: initial config vs new config (full) ==="
          diff ../.config .config || true

          echo "=== Diff: lost configs (from old config only) ==="
          diff ../.config .config | grep -e "^<" | grep -v "^< #" || true

          echo "=== Diff: new configs (from new config only) ==="
          diff ../.config .config | grep -e "^>" | grep -v "^> #" || true

          echo "=== Checking target device ==="
          if ! grep -Fxq "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_huasifei_wh3000-pro-emmc=y" .config; then
            echo "::error::Target device huasifei_wh3000-pro-emmc NOT found in final config!"
            echo "Available huasifei devices in current config:"
            grep "huasifei" .config || echo "(none found)"
            exit 1
          fi
          echo "✅ Config validated successfully"

      - name: Cache build dir
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir
            openwrt/build_dir
            openwrt/toolchain
            openwrt/dl
          key: ${{ env.TARGET_BOARD }}-${{ env.TARGET_SUBTARGET }}-${{ github.sha }}
          restore-keys: |
            ${{ env.TARGET_BOARD }}-${{ env.TARGET_SUBTARGET }}-

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc)
          # V=s 完整日志调试用；正式编译推荐 V=w
          # make -j$(nproc) V=s 完整明细（调试排错用）
          # make -j$(nproc) V=w 只输出警告+错误（平衡方案，当前推荐）
          # make -j$(nproc)      极简概要日志（日常编译，日志最少）

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: WH3000Pro-EMMC
          path: openwrt/bin/targets/${{ env.TARGET_BOARD }}/${{ env.TARGET_SUBTARGET }}

      - name: Generate release tag
        id: tag
        env:
          TZ: Asia/Shanghai
        run: |
          echo "release_tag=$(TZ=Asia/Shanghai date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          echo "release_date=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ImmortalWrt WH3000Pro EMMC ${{ steps.tag.outputs.release_date }}
          body: |
            ## 📦 ImmortalWrt WH3000Pro EMMC 固件
            - **源码分支**: ${{ env.REPO_BRANCH }}
            - **目标设备**: ${{ env.PROFILE }}
            - **编译时间**: ${{ steps.tag.outputs.release_date }}

            > ⚠️ 本固件由 GitHub Actions 自动编译生成
          files: |
            openwrt/bin/targets/${{ env.TARGET_BOARD }}/${{ env.TARGET_SUBTARGET }}/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
