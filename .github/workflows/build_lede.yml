name: Build Lede WH3000Pro EMMC
on:
  workflow_dispatch:
#  push:
#    branches: [ main ]
    #schedule:
    #- cron: '0 16 * * *'   # UTC 16:00 = 北京时间每天 00:00（半夜12点）

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  TARGET_BOARD: mediatek
  TARGET_SUBTARGET: filogic
  PROFILE: huasifei_wh3000-pro-emmc
  CONFIG_FILE: .config
  DIY1: diy-part1.sh
  DIY2: diy-part2.sh

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt update -y
          sudo apt full-upgrade -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
          genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
          libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
          libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev ninja-build p7zip p7zip-full patch pkgconf \
          python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
          swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd xz-utils zlib1g-dev

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth 1 -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} openwrt
          cd openwrt

      - name: diy-part1 feeds
        run: |
          cd openwrt
          chmod +x ../${{ env.DIY1 }}
          ../${{ env.DIY1 }}

      - name: Feeds update & install
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: diy-part2 copy plugin & modify config
        run: |
          cd openwrt
          chmod +x ../${{ env.DIY2 }}
          ../${{ env.DIY2 }}

      - name: Apply diffconfig
        run: |
          cd openwrt
          cat ../.config > .config

          # 临时规避已知的循环依赖
          sed -i 's/CONFIG_PACKAGE_luci-app-weechat=y/# CONFIG_PACKAGE_luci-app-weechat is not set/' .config || true

          echo "=== Running make defconfig ==="
          if ! make defconfig; then
            echo "::error::defconfig failed due to dependency issues"
            grep -i "recursive dependency\|does not exist" tmp/.config-package.in || true
            exit 1
          fi

          echo "=== Diff: initial config vs new config (full) ==="
          diff ../.config .config || true

          echo "=== Diff: lost configs (from old config only) ==="
          diff ../.config .config | grep -e "^<" | grep -v "^< #" || true

          echo "=== Diff: new configs (from new config only) ==="
          diff ../.config .config | grep -e "^>" | grep -v "^> #" || true

          echo "=== Checking target device ==="
          if ! grep -Fxq "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_huasifei_wh3000-pro-emmc=y" .config; then
            echo "::error::Target device huasifei_wh3000-pro-emmc NOT found in final config!"
            echo "Available huasifei devices in current config:"
            grep "huasifei" .config || echo "(none found)"
            exit 1
          fi
          echo "✅ Config validated successfully"

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc)
          # V=s 完整日志调试用；正式编译推荐 V=w
          # make -j$(nproc) V=s 完整明细（调试排错用）
          # make -j$(nproc) V=w 只输出警告+错误（平衡方案，当前推荐）
          # make -j$(nproc)      极简概要日志（日常编译，日志最少）

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: WH3000Pro-EMMC
          path: openwrt/bin/targets/${{ env.TARGET_BOARD }}/${{ env.TARGET_SUBTARGET }}

      - name: Generate release tag
        id: tag
        env:
          TZ: Asia/Shanghai
        run: |
          echo "release_tag=$(TZ=Asia/Shanghai date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          echo "release_date=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: Lede WH3000Pro EMMC ${{ steps.tag.outputs.release_date }}
          body: |
            ## 📦 LedeWrt WH3000Pro EMMC 固件
            - **源码分支**: ${{ env.REPO_BRANCH }}
            - **目标设备**: ${{ env.PROFILE }}
            - **编译时间**: ${{ steps.tag.outputs.release_date }}

            > ⚠️ 本固件由 GitHub Actions 自动编译生成
          files: |
            openwrt/bin/targets/${{ env.TARGET_BOARD }}/${{ env.TARGET_SUBTARGET }}/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
